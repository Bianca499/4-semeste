<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Canvas - Exercícios</title>
</head>

<body>

    <h2>Exercícios com Canvas</h2>

    <!-- Exercícios 1, 2 e 3 -->
    <canvas id="canvasBarra" width="400" height="100"
        style="border: 2px solid black;">
    </canvas>

    <br><br>

    <input type="range" id="progresso" min="0" max="100" value="0">

    <h2>Bandeiras</h2>

    <!-- Exercício 4 -->
    <canvas id="bandeiras" width="400" height="180"
        style="border: 2px solid black;">
    </canvas>

    <h2>Casa</h2>

    <!-- Exercício 5 -->
    <canvas id="casa" width="400" height="300"
        style="border: 2px solid black;">
    </canvas>

    <script src="script.js"></script>

</body>
</html>
