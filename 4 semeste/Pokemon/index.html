<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e53935, #8e0000);
            color: #222;
        }

        header {
            text-align: center;
            color: white;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 45px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 18px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        .busca {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .busca h2 {
            margin-bottom: 15px;
        }

        .campo {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        .card {
            display: grid;
            grid-template-columns: 45% 55%;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .imagem {
            background: linear-gradient(135deg, #f5f5f5, #ddd);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            position: relative;
        }

        .imagem img {
            width: 75%;
            max-width: 330px;
        }

        #numero {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            color: #777;
            font-size: 18px;
        }

        .info {
            padding: 40px;
        }

        .info h2 {
            font-size: 40px;
            text-transform: capitalize;
            margin-bottom: 15px;
        }

        .tipos {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tipo {
            background: #eee;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dados {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .dado {
            background: #f5f5f5;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
        }

        .dado span {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .dado strong {
            display: block;
        }

        .dado small {
            color: #777;
        }

        .habilidades {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .habilidade {
            background: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            text-transform: capitalize;
        }

        #mensagem {
            text-align: center;
            color: white;
            font-weight: bold;
            margin: 20px;
        }

        footer {
            text-align: center;
            color: white;
            padding: 30px;
        }

        @media (max-width: 750px) {
            .campo {
                flex-direction: column;
            }

            .card {
                grid-template-columns: 1fr;
            }

            .dados {
                grid-template-columns: 1fr;
            }

            .info {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🔴 Pokédex</h1>
        <p>Explore o mundo Pokémon</p>
    </header>

    <main>

        <section class="busca">

            <h2>🔎 Encontre seu Pokémon</h2>

            <div class="campo">

                <input
                    type="text"
                    id="pokemonInput"
                    placeholder="Digite o nome ou número do Pokémon"
                >

                <button id="buscar">
                    Buscar
                </button>

            </div>

        </section>

        <section class="card">

            <div class="imagem">

                <span id="numero">#000</span>

                <img
                    id="pokemonImagem"
                    src=""
                    alt="Pokémon"
                >

            </div>

            <div class="info">

                <h2 id="nome">
                    Pesquise um Pokémon
                </h2>

                <div id="tipos" class="tipos"></div>

                <div class="dados">

                    <div class="dado">
                        <span>⚖️</span>
                        <strong id="peso">--</strong>
                        <small>Peso</small>
                    </div>

                    <div class="dado">
                        <span>📏</span>
                        <strong id="altura">--</strong>
                        <small>Altura</small>
                    </div>

                    <div class="dado">
                        <span>⭐</span>
                        <strong id="experiencia">--</strong>
                        <small>Experiência</small>
                    </div>

                </div>

                <h3>Habilidades</h3>

                <div id="habilidades" class="habilidades"></div>

            </div>

        </section>

        <p id="mensagem"></p>

    </main>

    <footer>
        <p>Pokédex • Projeto de API</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
